<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 136 136">
  <!--
    Favicon build of the mark. Two deliberate differences from assets/mark.svg:

      1. SQUARE viewBox with the leaf centred. The mark's own box is 100x136;
         dropped into a square tab slot that letterboxes to a sliver about a
         third of the available width.
      2. NO VEINS. They are sub-pixel at 16-32px, so they contribute nothing but
         a grey haze over the silhouette — and bytes.

    Ships with a filled rounded ground rather than transparency: a pale-blue
    leaf on a dark browser tab strip is close to invisible on its own.
  -->
  <rect width="136" height="136" rx="30" fill="#071A2E"/>
  <g transform="translate(18 0)">
    <defs>
      <linearGradient id="f" x1="0.15" y1="0" x2="0.5" y2="1">
        <stop offset="0" stop-color="#DCF4FF"/>
        <stop offset="0.4" stop-color="#7FD0FF"/>
        <stop offset="1" stop-color="#3D93D6"/>
      </linearGradient>
    </defs>
    <path fill="url(#f)" d="
      M50 10
      C57 16 60 23 61 31
      C68 31 73 35 73 43
      C73 51 68 55 62 57
      C71 57 81 62 81 71
      C81 79 72 83 63 85
      C71 86 76 90 76 97
      C76 104 68 108 60 109
      C64 111 66 114 65 118
      C64 123 57 127 50 129
      C43 127 36 123 35 118
      C34 114 36 111 40 109
      C32 108 24 104 24 97
      C24 90 29 86 37 85
      C28 83 19 79 19 71
      C19 62 29 57 38 57
      C32 55 27 51 27 43
      C27 35 32 31 39 31
      C40 23 43 16 50 10
      Z"/>
  </g>
</svg>
